name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch complete hev-socks5-tunnel (with submodules)
        run: |
          set -e
          JNI_DIR="app/src/main/jni"
          rm -rf "$JNI_DIR/hev-socks5-tunnel"
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel.git "$JNI_DIR/hev-socks5-tunnel"
          printf '%s\n' \
            'APP_OPTIM := release' \
            'APP_PLATFORM := android-26' \
            'APP_ABI := armeabi-v7a arm64-v8a x86 x86_64' \
            'APP_CFLAGS := -O3 -DANDROID' \
            'APP_SUPPORT_FLEXIBLE_PAGE_SIZES := true' \
            > "$JNI_DIR/Application.mk"
          printf '%s\n' 'include $(call all-subdir-makefiles)' > "$JNI_DIR/Android.mk"
          test -f "$JNI_DIR/hev-socks5-tunnel/src/hev-jni.c"
          test -f "$JNI_DIR/hev-socks5-tunnel/src/hev-main.c"
          test -f "$JNI_DIR/hev-socks5-tunnel/src/misc/hev-utils.h"
          ls -la "$JNI_DIR/hev-socks5-tunnel/src"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;26.1.10909125"
          sdkmanager --install "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SshVpn-APK
          path: app/build/outputs/apk/debug/*.apk
